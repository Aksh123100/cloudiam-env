name: CloudIAMEnv
version: 1.0.0
description: Cloud Security Configuration environment for training RL agents to fix AWS IAM policy vulnerabilities
author: OpenEnv Hackathon Team
license: MIT

environment:
  type: reinforcement_learning
  domain: cloud_security
  framework: openenv
  
observation_space:
  type: object
  properties:
    task_id:
      type: string
      description: Unique identifier for the security task
    goal_description:
      type: string
      description: Natural language description of the security goal
    vulnerable_policy:
      type: string
      description: JSON string of the vulnerable AWS IAM policy

action_space:
  type: object
  properties:
    fixed_policy:
      type: string
      description: JSON string of the corrected IAM policy

tasks:
  - id: easy_wildcard_action
    difficulty: easy
    description: Restrict wildcard action to specific S3 operation
  - id: medium_public_bucket
    difficulty: medium
    description: Add IP address condition to restrict public access
  - id: hard_conflicting_rules
    difficulty: hard
    description: Resolve conflicting Allow/Deny rules for DynamoDB access

reward:
  type: float
  range: [0.05, 0.95]
  description: |
    Graded reward based on security fix quality (strictly between 0 and 1):
    - 0.05: Invalid JSON or parse error
    - 0.3: Valid JSON but security goal not met
    - 0.7: Security goal met but legitimate access broken
    - 0.9: Perfect fix with security and functionality

api:
  port: 7860
  endpoints:
    standard:
      - /reset
      - /step
      - /state
    custom:
      - /tasks
      - /grader
      - /baseline
    
deployment:
  platform: huggingface_spaces
  runtime: docker
  requirements:
    - python>=3.9
    - fastapi>=0.104.0
    - uvicorn>=0.24.0
    - pydantic>=2.0.0

tags:
  - reinforcement-learning
  - cloud-security
  - iam-policies
  - aws
  - openenv
  - devsecops
